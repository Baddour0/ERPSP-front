<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dashboard — ERPSB</title>
  <meta name="description" content="ERPSB ERP Dashboard — financial KPIs, revenue charts, and recent activity"/>
  <link rel="stylesheet" href="css/main.css"/>
  <style>
    .charts-row { display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-bottom:24px; }
    .activity-row { display:grid; grid-template-columns:3fr 2fr; gap:16px; }
    .donut-wrap { display:flex; align-items:center; justify-content:center; gap:24px; padding:16px; }
    .donut-svg { flex-shrink:0; }
    .donut-legend { display:flex; flex-direction:column; gap:10px; }
    .donut-leg-item { display:flex; align-items:center; gap:8px; font-size:12.5px; }
    .donut-leg-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .donut-leg-val { margin-left:auto; font-weight:700; font-size:13px; }
    .revenue-labels { display:grid; grid-template-columns:repeat(6,1fr); text-align:center; }
    .revenue-labels span { font-size:10px; color:var(--text-muted); }
    .activity-item {
      display:flex; align-items:center; gap:12px;
      padding:10px 0; border-bottom:1px solid var(--border);
    }
    .activity-item:last-child { border-bottom:none; }
    .act-avatar {
      width:34px; height:34px; border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      font-size:15px; flex-shrink:0;
    }
    .act-body { flex:1; min-width:0; }
    .act-body .act-title { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .act-body .act-sub   { font-size:11.5px; color:var(--text-muted); }
    .act-amount { font-size:13px; font-weight:700; text-align:right; flex-shrink:0; }
    @media(max-width:1024px){
      .charts-row,.activity-row { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
<div id="page-root">
  <div class="page-content">

    <!-- Page Header -->
    <div class="page-header">
      <div class="page-header-left">
        <div class="breadcrumb">Home / Dashboard</div>
        <h1 id="dash-greeting">Good morning 👋</h1>
      </div>
      <div class="flex gap-2">
        <button class="btn btn-ghost btn-sm">📅 This Month</button>
        <a href="invoice-new.html" class="btn btn-primary btn-sm">+ New Invoice</a>
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="kpi-grid" id="kpi-grid">
      <!-- Injected by JS -->
    </div>

    <!-- Charts Row -->
    <div class="charts-row">
      <!-- Revenue Chart -->
      <div class="card">
        <div class="card-header">
          <h3>Monthly Revenue</h3>
          <div class="flex gap-2">
            <button class="filter-chip active" data-range="6m">6M</button>
            <button class="filter-chip" data-range="1y">1Y</button>
          </div>
        </div>
        <div class="card-body">
          <div class="chart-bar-wrap" id="revenue-bars"></div>
          <div class="revenue-labels" id="revenue-labels"></div>
        </div>
      </div>

      <!-- Status Donut -->
      <div class="card">
        <div class="card-header"><h3>Invoice Status</h3></div>
        <div class="card-body">
          <div class="donut-wrap">
            <svg class="donut-svg" width="120" height="120" viewBox="0 0 120 120" id="donut-svg">
              <circle cx="60" cy="60" r="46" fill="none" stroke="var(--bg-elevated)" stroke-width="16"/>
            </svg>
            <div class="donut-legend" id="donut-legend"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Activity + Top Partners -->
    <div class="activity-row">
      <!-- Recent Invoices -->
      <div class="card">
        <div class="card-header">
          <h3>Recent Invoices</h3>
          <a href="invoices.html" class="btn btn-ghost btn-sm">View all →</a>
        </div>
        <div class="card-body" id="recent-invoices"></div>
      </div>

      <!-- Top Partners -->
      <div class="card">
        <div class="card-header"><h3>Top Partners</h3></div>
        <div class="card-body" id="top-partners"></div>
      </div>
    </div>

  </div>
</div>

<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
renderLayout('Dashboard', '📊');

/* ── Greeting ── */
const h = new Date().getHours();
document.getElementById('dash-greeting').textContent =
  (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + ' 👋';

/* ── KPI Cards ── */
async function loadKPIs() {
  const invs = (await api.invoices.list()) || mock.invoices;
  const total   = invs.reduce((s,i) => s + (i.total||0), 0);
  const paid    = invs.filter(i=>i.status==='Paid').reduce((s,i)=>s+(i.total||0),0);
  const overdue = invs.filter(i=>i.status==='Overdue').length;
  const outstanding = invs.filter(i=>['Sent','Overdue'].includes(i.status)).reduce((s,i)=>s+(i.total||0),0);

  const cards = [
    { label:'Total Revenue',    value: fmt.currency(total),       change:'+12.4%', dir:'up',   color:'accent',  icon:'💰' },
    { label:'Collected',        value: fmt.currency(paid),        change:'+8.1%',  dir:'up',   color:'success', icon:'✅' },
    { label:'Outstanding',      value: fmt.currency(outstanding), change:'-3.2%',  dir:'down', color:'warning', icon:'⏳' },
    { label:'Overdue Invoices', value: overdue,                   change:overdue>0?'+'+overdue:'0', dir:overdue>0?'down':'up', color:'danger', icon:'⚠️' },
  ];

  document.getElementById('kpi-grid').innerHTML = cards.map(c => `
    <div class="kpi-card ${c.color}">
      <div class="kpi-icon ${c.color}">${c.icon}</div>
      <div class="kpi-label">${c.label}</div>
      <div class="kpi-value">${c.value}</div>
      <div class="kpi-change ${c.dir}">
        ${c.dir==='up'?'↑':'↓'} ${c.change} vs last month
      </div>
    </div>
  `).join('');
}

/* ── Revenue Chart ── */
function renderRevenueChart() {
  const months = ['Nov','Dec','Jan','Feb','Mar','Apr'];
  const values = [28000,34000,29000,42000,38000,44000];
  const max    = Math.max(...values);

  document.getElementById('revenue-bars').innerHTML = values.map((v,i) => `
    <div class="chart-bar" style="height:${Math.round((v/max)*100)}%" title="${months[i]}: ${fmt.currency(v)}"></div>
  `).join('');

  document.getElementById('revenue-labels').innerHTML = `
    <div class="revenue-labels">${months.map(m=>`<span>${m}</span>`).join('')}</div>
  `;
}

/* ── Donut Chart ── */
function renderDonut() {
  const data = [
    { label:'Paid',    value:2, color:'#10B981' },
    { label:'Sent',    value:2, color:'#3B82F6' },
    { label:'Overdue', value:1, color:'#EF4444' },
    { label:'Draft',   value:1, color:'#475569' },
  ];
  const total  = data.reduce((s,d)=>s+d.value,0);
  const r = 46, cx=60, cy=60, circ=2*Math.PI*r;
  let offset = 0;
  let arcs = '';
  data.forEach(d => {
    const pct  = d.value / total;
    const dash = pct * circ;
    arcs += `<circle cx="${cx}" cy="${cy}" r="${r}"
      fill="none" stroke="${d.color}" stroke-width="16"
      stroke-dasharray="${dash} ${circ - dash}"
      stroke-dashoffset="${-offset}"
      transform="rotate(-90 ${cx} ${cy})"
      style="transition:stroke-dasharray 0.5s ease;"/>`;
    offset += dash;
  });
  document.getElementById('donut-svg').innerHTML =
    `<circle cx="60" cy="60" r="46" fill="none" stroke="var(--bg-elevated)" stroke-width="16"/>` + arcs +
    `<text x="60" y="56" text-anchor="middle" fill="var(--text-primary)" font-size="16" font-weight="700" font-family="Inter">${total}</text>
     <text x="60" y="70" text-anchor="middle" fill="var(--text-muted)"    font-size="9"  font-family="Inter">invoices</text>`;

  document.getElementById('donut-legend').innerHTML = data.map(d => `
    <div class="donut-leg-item">
      <div class="donut-leg-dot" style="background:${d.color}"></div>
      <span style="color:var(--text-secondary)">${d.label}</span>
      <span class="donut-leg-val">${d.value}</span>
    </div>
  `).join('');
}

/* ── Recent Invoices ── */
async function loadRecentInvoices() {
  const invs = ((await api.invoices.list()) || mock.invoices).slice(0,5);
  document.getElementById('recent-invoices').innerHTML = invs.map(inv => `
    <div class="activity-item">
      <div class="act-avatar" style="background:var(--accent-dim)">${inv.partner?.name?.[0]||'?'}</div>
      <div class="act-body">
        <div class="act-title">${inv.invoiceNumber}</div>
        <div class="act-sub">${inv.partner?.name||'—'} · ${fmt.date(inv.issueDate)}</div>
      </div>
      ${statusBadge(inv.status)}
      <div class="act-amount">${fmt.currency(inv.total)}</div>
    </div>
  `).join('');
}

/* ── Top Partners ── */
async function loadTopPartners() {
  const partners = (await api.partners.list()) || mock.partners;
  const invs     = (await api.invoices.list())  || mock.invoices;

  const totals = {};
  invs.forEach(inv => {
    const n = inv.partner?.name||'Unknown';
    totals[n] = (totals[n]||0) + (inv.total||0);
  });
  const sorted = Object.entries(totals).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxV = sorted[0]?.[1] || 1;

  document.getElementById('top-partners').innerHTML = sorted.map(([name,val]) => `
    <div style="margin-bottom:14px;">
      <div class="flex items-center gap-2 mb-1">
        <span style="font-size:13px;font-weight:600;flex:1">${name}</span>
        <span style="font-size:12px;color:var(--text-secondary)">${fmt.currency(val)}</span>
      </div>
      <div style="height:4px;background:var(--bg-elevated);border-radius:2px;">
        <div style="height:100%;width:${Math.round(val/maxV*100)}%;background:var(--accent);border-radius:2px;transition:width 0.8s ease;"></div>
      </div>
    </div>
  `).join('');
}

/* ── Init ── */
loadKPIs();
renderRevenueChart();
renderDonut();
loadRecentInvoices();
loadTopPartners();
</script>
</body>
</html>
