<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Invoice Detail — ERPSB</title>
  <meta name="description" content="View and manage invoice details"/>
  <link rel="stylesheet" href="css/main.css"/>
  <style>
    .inv-detail-grid { display:grid; grid-template-columns:1fr 300px; gap:20px; align-items:start; }
    .printable { background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:32px; }
    .inv-header-from-to { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin:24px 0; }
    .inv-party label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); display:block; margin-bottom:4px; }
    .inv-party .party-name { font-size:16px; font-weight:700; }
    .inv-party .party-details { font-size:12.5px; color:var(--text-secondary); margin-top:4px; line-height:1.7; }
    .inv-meta-row { display:flex; gap:24px; padding:16px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .inv-meta-item label { font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); display:block; }
    .inv-meta-item span  { font-size:13.5px; font-weight:600; }
    .inv-totals { margin-top:16px; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
    .inv-total-row { display:flex; gap:40px; font-size:13.5px; }
    .inv-total-row span:last-child { width:120px; text-align:right; font-weight:600; }
    .inv-total-final { border-top:2px solid var(--border); padding-top:8px; font-size:16px; font-weight:800; color:var(--accent-light); }
    @media print {
      .sidebar,.topbar,.no-print { display:none!important; }
      .main-content { margin:0!important; padding:0!important; }
      .inv-detail-grid { grid-template-columns:1fr; }
    }
    @media(max-width:1024px){ .inv-detail-grid{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div id="page-root">
  <div class="page-content">
    <div class="page-header no-print">
      <div class="page-header-left">
        <div class="breadcrumb"><a href="invoices.html">Invoices</a> / Detail</div>
        <h1 id="pg-title">Invoice</h1>
      </div>
      <div class="flex gap-2">
        <button class="btn btn-ghost" onclick="window.print()">🖨 Print</button>
        <button class="btn btn-ghost" id="btn-send" onclick="updateStatus('Sent')">📤 Mark Sent</button>
        <button class="btn btn-primary" id="btn-paid" onclick="updateStatus('Paid')">✅ Mark Paid</button>
      </div>
    </div>

    <div class="inv-detail-grid">
      <!-- Invoice Document -->
      <div class="printable" id="invoice-doc">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;">
          <div>
            <div style="display:flex;align-items:center;gap:10px;">
              <div style="width:40px;height:40px;background:linear-gradient(135deg,#6366F1,#A78BFA);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:18px;">E</div>
              <div>
                <div style="font-weight:700;font-size:16px;">ERPSB</div>
                <div style="color:var(--text-muted);font-size:11px;" id="tenant-display"></div>
              </div>
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:28px;font-weight:800;letter-spacing:-1px;">INVOICE</div>
            <div id="inv-number-display" style="color:var(--accent-light);font-weight:700;font-size:15px;"></div>
            <div id="inv-status-display" style="margin-top:6px;"></div>
          </div>
        </div>

        <div class="inv-header-from-to">
          <div class="inv-party">
            <label>From</label>
            <div class="party-name">Your Company</div>
            <div class="party-details">123 Business St<br/>Cairo, Egypt<br/>tax@yourcompany.com</div>
          </div>
          <div class="inv-party">
            <label>Bill To</label>
            <div class="party-name" id="partner-name">—</div>
            <div class="party-details" id="partner-details">—</div>
          </div>
        </div>

        <div class="inv-meta-row">
          <div class="inv-meta-item"><label>Issue Date</label><span id="d-issue">—</span></div>
          <div class="inv-meta-item"><label>Due Date</label><span id="d-due">—</span></div>
          <div class="inv-meta-item"><label>Tenant</label><span id="d-tenant">—</span></div>
        </div>

        <!-- Line Items -->
        <div class="table-wrap" style="margin-top:20px;">
          <table style="width:100%;border-collapse:collapse;font-size:13.5px;">
            <thead>
              <tr>
                <th style="text-align:left;padding:8px 0;border-bottom:2px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Description</th>
                <th style="text-align:right;padding:8px 0;border-bottom:2px solid var(--border);font-size:11px;text-transform:uppercase;color:var(--text-muted);">Qty</th>
                <th style="text-align:right;padding:8px 0;border-bottom:2px solid var(--border);font-size:11px;text-transform:uppercase;color:var(--text-muted);">Unit Price</th>
                <th style="text-align:right;padding:8px 0;border-bottom:2px solid var(--border);font-size:11px;text-transform:uppercase;color:var(--text-muted);">Total</th>
              </tr>
            </thead>
            <tbody id="lines-tbody">
              <tr><td colspan="4" class="text-center" style="padding:20px;color:var(--text-muted);">Loading…</td></tr>
            </tbody>
          </table>
        </div>

        <!-- Totals -->
        <div class="inv-totals">
          <div class="inv-total-row"><span>Subtotal</span><span id="t-sub">—</span></div>
          <div class="inv-total-row"><span>Tax</span><span id="t-tax">—</span></div>
          <div class="inv-total-row inv-total-final"><span>Total Due</span><span id="t-total">—</span></div>
        </div>

        <div style="margin-top:28px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted);">
          Thank you for your business. Payment due within 30 days.
        </div>
      </div>

      <!-- Sidebar Actions -->
      <div class="no-print">
        <div class="card mb-4">
          <div class="card-header"><h3>Actions</h3></div>
          <div class="card-body" style="display:flex;flex-direction:column;gap:8px;">
            <button class="btn btn-primary w-full" style="justify-content:center" onclick="updateStatus('Paid')">✅ Mark as Paid</button>
            <button class="btn btn-ghost w-full" style="justify-content:center" onclick="updateStatus('Sent')">📤 Mark as Sent</button>
            <button class="btn btn-ghost w-full" style="justify-content:center" onclick="window.print()">🖨 Print / PDF</button>
            <button class="btn btn-danger w-full" style="justify-content:center" onclick="deleteThisInvoice()">🗑 Delete Invoice</button>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><h3>Timeline</h3></div>
          <div class="card-body" id="timeline">
            <div class="activity-item">
              <div class="act-avatar" style="background:var(--accent-dim)">📝</div>
              <div class="act-body"><div class="act-title">Invoice created</div><div class="act-sub">Today</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
renderLayout('Invoice Detail', '🧾');

const params = new URLSearchParams(window.location.search);
const invId  = params.get('id');
document.getElementById('tenant-display').textContent = getTenant();
document.getElementById('d-tenant').textContent       = getTenant();

async function loadInvoice() {
  let inv = await api.invoices.get(invId);
  if (!inv) inv = mock.invoices.find(i=>i.id===invId) || mock.invoices[0];
  if (!inv) return;

  document.title = inv.invoiceNumber + ' — ERPSB';
  document.getElementById('pg-title').textContent     = inv.invoiceNumber;
  document.getElementById('inv-number-display').textContent = inv.invoiceNumber;
  document.getElementById('inv-status-display').innerHTML   = statusBadge(inv.status);
  document.getElementById('partner-name').textContent = inv.partner?.name || '—';
  document.getElementById('partner-details').textContent = inv.partner?.address || '';
  document.getElementById('d-issue').textContent = fmt.date(inv.issueDate);
  document.getElementById('d-due').textContent   = fmt.date(inv.dueDate) || '30 days net';
  document.getElementById('t-sub').textContent   = fmt.currency(inv.subTotal);
  document.getElementById('t-tax').textContent   = fmt.currency(inv.taxAmount);
  document.getElementById('t-total').textContent = fmt.currency(inv.total);

  const lines = inv.invoiceLines || [
    { description:'Professional Services', quantity:1, unitPrice: inv.subTotal, total: inv.total }
  ];
  document.getElementById('lines-tbody').innerHTML = lines.map(l => `
    <tr style="border-bottom:1px solid var(--border);">
      <td style="padding:10px 0;">${l.description||'—'}</td>
      <td style="text-align:right;padding:10px 0;">${l.quantity||1}</td>
      <td style="text-align:right;padding:10px 0;">${fmt.currency(l.unitPrice)}</td>
      <td style="text-align:right;padding:10px 0;font-weight:700;">${fmt.currency(l.total||l.unitPrice)}</td>
    </tr>
  `).join('');

  // Hide paid button if already paid
  if (inv.status==='Paid') document.getElementById('btn-paid')?.setAttribute('disabled','true');
}

async function updateStatus(status) {
  await api.patch('/api/invoices/'+invId, { status });
  showToast('Status updated to ' + status);
  loadInvoice();
}

async function deleteThisInvoice() {
  if (!confirm('Delete this invoice?')) return;
  await api.delete('/api/invoices/'+invId);
  showToast('Invoice deleted');
  setTimeout(()=>window.location.href='invoices.html', 800);
}

loadInvoice();
</script>
</body>
</html>
